[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ltmia"
version = "0.1.0"
description = "Large-scale Transferable Membership Inference Attack for Language Models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "David Ilic" },
]
keywords = [
    "membership inference attack",
    "language models",
    "machine learning",
    "privacy",
    "security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "peft>=0.6.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/JetBrains-Research/ltmia"
Repository = "https://github.com/JetBrains-Research/ltmia"

[project.scripts]
ltmia-extract = "ltmia.cli.extract:main"
ltmia-extract-all = "ltmia.cli.extract_all:main"
ltmia-train = "ltmia.cli.train:main"
ltmia-eval = "ltmia.cli.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
sources = {".." = "ltmia"}

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
